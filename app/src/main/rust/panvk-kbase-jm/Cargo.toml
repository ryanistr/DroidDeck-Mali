[package]
name = "panvk-kbase-jm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "panvk_kbase_jm"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
jni = { version = "0.21", default-features = false, features = ["invocation"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"