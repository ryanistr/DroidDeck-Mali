name: Build PanVK (Mesa)

# The runtime PanVK driver (glibc) built from Mesa, on an arm64 runner,
# then published as a release asset the apk build fetches (tools/panvk/release.env names the tag and sha).
on:
  push:
    paths:
      - 'tools/panvk/**'
      - '.github/workflows/build-panvk.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish as (e.g. panvk-linux-24.3.0-p1); empty = artifact only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git meson ninja-build pkg-config \
            libwayland-dev libdrm-dev libx11-dev libxext-dev \
            libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-sync-dev libxshmfence-dev libxxf86vm-dev \
            libglvnd-dev libegl-dev libgles-dev \
            python3-mako python3-ply python3-yaml \
            llvm-17-dev clang-17 lld-17 \
            libelf-dev libwayland-egl-backend-dev \
            libxfixes-dev libxcb-glx0-dev libxcb-shm0-dev libxcb-keysyms1-dev libx11-xcb-dev \
            bison flex \
            zstd >/dev/null
      - name: Build PanVK
        env:
          MESA_VERSION: 24.3.0
        run: |
          set -euo pipefail
          cd /home/runner/work/DroidDeck-Mali/DroidDeck-Mali
          bash tools/panvk/build-panvk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: panvk-linux
          path: |
            panvk-linux-*.tzst
            panvk-linux-*.tzst.sha256
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" --latest=false --prerelease=false --title "${{ inputs.tag }}" --notes "Mesa PanVK ${{ inputs.tag }}; staged by the apk into linuxfs/usr/lib. sha256 $(cut -d' ' -f1 panvk-linux-*.tzst.sha256)" panvk-linux-*.tzst panvk-linux-*.tzst.sha256 || gh release upload "${{ inputs.tag }}" panvk-linux-*.tzst panvk-linux-*.tzst.sha256 --clobber
          # A component the apk fetches by tag, never something users install: it must not
          # become the repo's Latest release or appear as a pre-release, also when re-uploaded.
          gh release edit "${{ inputs.tag }}" --latest=false --prerelease=false